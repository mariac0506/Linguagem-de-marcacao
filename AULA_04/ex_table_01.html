<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 1 - Tabela</title>
	</head>
	<body>
	<table border="1" width="100%">
		<thead>
			<tr>
				<th colspan="5" style="background-color:green;">Tabela de Serviços Mecânicos</th>
			</tr>
			
		</thead>
		
		<tbody>
			<tr>
				<!-- <td>-</td> -->
				<th rowspan="5" style="background-color: blue;">nacionais</th>
				<th style="background-color: gray;">veiculos</th>
				<th style="background-color: gray;">serviço</th>
				<th style="background-color: gray;">tempo previsto</th>
				<th style="background-color: gray;">Valor</th>
				
			</tr>
			<tr>
				<!-- <td rowspan="1";>-</td> -->
				<td>Caminhonete S10</td>
				<td>Suspensão</td>
				<td>3 horas e 25 minutos</td>
				<td>350,00</td>
			</tr>
			<tr>
				<td>caminhonete ranger</td>
				<td>freio</td>
				<td>3 horas e 45 minutos</td>
				<td>200,00</td>
			</tr>
			<tr>
				<!-- <td>-</td> -->
				<td>Caminhonete hilux</td>
				<td>troca de bateria</td>
				<td>30 minutos</td>
				<td>25,00</td>
			</tr>
			<tr>
				<!-- <td>-</td> -->
				<td>caminhonete D10</td>
				<td>alinhamento</td>
				<td>1 hora e 40 minutos</td>
				<td>220.0</td>
			</tr>
		</tbody>
	</table>
	</body>
</html>
