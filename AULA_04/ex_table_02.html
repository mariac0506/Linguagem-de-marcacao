<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2 - table</title>
	</head>
	<body>
		<table border="1" width="100%">
			<tr style="background-color:purple; color:white">
				<th>cabeçalho 1</th>
				<th>cabeçalho 2</th>
				<th>cabeçalho 3</th>
			</tr>
			<tr>
				<td style="background-color:#000; color:#FFF">conteúdo 1</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color:yellow; color:#000">1</td>
							<td style="background-color:red; color:#FFF; text-align:right;">2</td>
						</tr>
						<tr>
							<td style="background-color:blue; color:#FFF;  text-align:right;">3</td>
							<td style="background-color:green; color:#000">4</td>
						</tr>
					</table>
				</td>
				<td style="background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3HV9GQXT9x2qyZk2oCZXbSkcsimp6iFo3oxN5NBueCw&s=10');">conteúdo 3</td>
			</tr>
			<tr>
				<td style="background-color:#000; color:#FFF">conteúdo 4</td>
				<td style="background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnGxAF1VOYAwP_IwDfD9uZ6qC9w5T_LFI80KoxYSRvOaxCjJRBrSSHOmED&s=10'); text-align: right">conteúdo 5</td>	
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color:orange; text-align: center;">5</td>
							<td style="background-color:red; color:pink;">6</td>
						</tr>
						<tr>
							<td style="background-color:red; text-align:right;">7</td>
							<td style="background-color:orange;text-align: center;">4</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
