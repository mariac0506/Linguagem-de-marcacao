<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Estilo Interno</title>
		<style>
			p{
				color: blue;
				font-size: 34px;
				font-family: arial;
			}
			p{
				color: red;
			}
			p{
				color: purple;
				text-align: center;
			}
			/*chamando a classe -> usa-se . */
			.texto-verde{
				color:green;
			}
			
			/*chamando o id -> usa-se # */
			#texto-rosa{
				color:pink;
			}
		</style>
	</head>
	<body>
		<p>Texto com estilo interno</p>
		<p class="texto-verde">texto 2</p>
		<p id="texto-rosa">texto 3</p>
	</body>
</html>
