<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>cadastro de usuario</title>
	</head>
	<body>
		<!-- cria um formulario
		<form>-tag de formulario
		atributo "action" aponta para uma pagina
		atributo "method":
			-GET: passa os dados pelo URL
			-POST: passa os dados pelo corpo
		-->
		<form action="#" method="POST">
		<!--label - rotulo do campo -->
			<label>nome completo:</label>
			<br>
			
			<!-- INPUT - campo de entrada de dados
				TYPE - tipo do campo
				ID - identificador (para javascript)
				Name - indentificador (para PHP)
			-->
			
			<input type="text" id="nome" name="nome">
			<br><br>
			
			<!-- Input submit cria um botão -->
			<input type="submit" value="cadastrar">
			
		</form>
	</body>
</html>
