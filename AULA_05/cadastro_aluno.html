<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>cadastro do aluno</title>
	</head>
	<body>
		<header>
			<h1 style="text-align: center">cadastro do aluno</h1>
			<hr>
			<form action="#" method="POST">
				<label for="nome">nome do aluno:</label>
				<br>
				<input type="text" id="nome" name="nome" placeholder="nome do aluno..." minlength="3" maxlength="255"required>
				<br>
				<label for="email">e-mail do aluno:</label>
				<br>
				<input type="email" id="email" placeholder="email@email.com" required>
				<br>
				
				
				<label for="ra">registro do aluno:</label>
				<br>
				<input type="text" id="ra" placeholder="registro..." value="20261015" disabled>
				<br>
				
				
				<label for="telefone">telefone do  aluno:</label>
				<br>
				<input type="tel" id="telefone" name="telefone" placeholder="(OO) 00000-0000" required>
				<br>
				<label for="data_nascimento">data  de nascimento:</label>
				<br>
				<input type="date" id="data_nascimento" name="data_nascimento" max="2009-01-01" required>
				<br>
				<label for="idade">idade:</label>
				<br>
				<input type="number" id="idade" name="idade" max="100" required>
				<br><br>
				<label for="genero">genero:</label>
				<br>
				<input type="radio" id="masculino" name="genero" value="masculino" required>masculino
				<br>
				<input type="radio" id="feminino" name="genero" value="feminino">feminino
				<br>
				<input type="radio" id="outro" name="genero" value="outro">outro
				<br><br>
				<label for="turma">selecione a turma:</label>
				<br>
				<select id="turma" name="turma" required>
					<option value="selecione">selecione...</option>
					<option value="1EMA">1 EM A</option>
					<option value="1EMB">1 EM B</option>
					<option value="2EMA">2 EM A</option>
					<option value="2EMB">2 EM B</option>
					<option value="3EMA">3 EM A</option>
					<option value="3EMB">3 EM B</option>
				</select>
				<br><br>
				
				<label for="foto">foto do aluno:</label>
				<br>
				<input type="file" id="foto" name="foto" required >
				<br>
				<label for="comentarios">reclamações,comentarios e elogios...</label>
				<br>
				<textarea id="comentarios" name="comentarios" placeholder="texto..."></textarea>
				<br>
				<input type="checkbox" id="termos" name="termos" >Li e concordo com todos os Termos e Condiçoes
				<br>
				<input type="checkbox" id="notificaçoes" name="notificaçoes">Aceito receber notificaçoes
				<br><br>
				<input type="submit" value="cadastar aluno">
			</form>
		</header>
	</body>
</html>
